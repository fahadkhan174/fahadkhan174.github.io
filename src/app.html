<!doctype html>
<html lang="en" class="dark scroll-smooth">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0a0a0b" />
		<meta name="color-scheme" content="dark light" />
		<meta name="author" content="Fahad Khan" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/inter-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>

		<script>
			// Apply the saved theme before first paint to avoid a flash of the wrong palette.
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var dark = stored !== 'light';
					document.documentElement.classList.toggle('dark', dark);
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', dark ? '#0a0a0b' : '#f4f2ed');
				} catch (e) {
					/* storage blocked — keep the dark default */
				}
			})();
		</script>

		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Person",
				"name": "Fahad Khan",
				"jobTitle": "Full Stack Engineer",
				"url": "https://fahadkhan174.github.io/",
				"worksFor": { "@type": "Organization", "name": "IBM" },
				"sameAs": [
					"https://github.com/fahadkhan174",
					"https://www.linkedin.com/in/mohd-fahad-123205101/",
					"https://instagram.com/fahad_clicks_"
				],
				"knowsAbout": [
					"Java",
					"Spring Boot",
					"JavaScript",
					"React",
					"SvelteKit",
					"Node.js",
					"MongoDB",
					"IBM Cloudant"
				]
			}
		</script>

		%sveltekit.head%
	</head>
	<body id="top" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
